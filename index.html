<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before Your Assessment - Preparation Guide</title>
    <style>
        /* GOV.UK Design System Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "GDS Transport", Arial, sans-serif;
            font-size: 19px;
            line-height: 1.5;
            color: #0b0c0c;
            background: #f3f2f1;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .govuk-width-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 15px;
        }

        @media (min-width: 641px) {
            .govuk-width-container {
                padding: 0 30px;
            }
        }

        /* Simple Header */
        .header {
            background: white;
            padding: 20px 0;
            border-bottom: 1px solid #b1b4b6;
            margin-bottom: 30px;
        }

        .header-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (min-width: 641px) {
            .header-container {
                padding: 0 30px;
            }
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #003078;
        }

        .save-btn {
            background: #f3f2f1;
            border: 1px solid #b1b4b6;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            color: #0b0c0c;
        }

        .save-btn:hover {
            background: #e0e0e0;
        }

        /* Main Content */
        .govuk-main-wrapper {
            background: white;
            padding: 30px 15px 40px 15px;
            min-height: calc(100vh - 200px);
        }

        @media (min-width: 641px) {
            .govuk-main-wrapper {
                padding: 30px 30px 40px 30px;
            }
        }

        /* Progress indicator */
        .progress-indicator {
            margin-bottom: 30px;
        }

        .progress-bar-container {
            width: 100%;
            height: 40px;
            background: #f3f2f1;
            border: 2px solid #b1b4b6;
            margin-bottom: 10px;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: #00703c;
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: flex-end;
            padding-right: 10px;
        }

        .progress-bar-text {
            color: white;
            font-weight: bold;
            font-size: 16px;
        }

        .progress-bar-text.dark {
            color: #0b0c0c;
            position: absolute;
            right: 10px;
            top: 50%;
            transform: translateY(-50%);
        }

        .progress-dots {
            display: inline-flex;
            gap: 10px;
            list-style: none;
            justify-content: center;
        }

        .progress-dot {
            width: 15px;
            height: 15px;
            border-radius: 50%;
            background: #b1b4b6;
        }

        .progress-dot.active {
            background: #1d70b8;
        }

        .progress-dot.completed {
            background: #00703c;
        }

        /* Typography */
        .govuk-heading-xl {
            font-size: 48px;
            line-height: 1.09375;
            font-weight: bold;
            margin-bottom: 30px;
            margin-top: 15px;
        }

        .govuk-heading-l {
            font-size: 36px;
            line-height: 1.11111;
            font-weight: bold;
            margin-bottom: 20px;
            margin-top: 15px;
        }

        .govuk-heading-m {
            font-size: 24px;
            line-height: 1.25;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 15px;
        }

        .govuk-body {
            font-size: 19px;
            line-height: 1.5;
            margin-bottom: 15px;
        }

        .govuk-caption {
            font-size: 19px;
            color: #505a5f;
            display: block;
            margin-bottom: 5px;
        }

        @media (max-width: 640px) {
            .govuk-heading-xl {
                font-size: 32px;
            }
            .govuk-heading-l {
                font-size: 24px;
            }
        }

        /* Back Link */
        .govuk-back-link {
            font-size: 16px;
            line-height: 1.25;
            display: inline-block;
            margin-bottom: 15px;
            margin-top: 15px;
            text-decoration: none;
            color: #0b0c0c;
            border-bottom: 1px solid #0b0c0c;
        }

        .govuk-back-link:hover {
            color: #0b0c0c;
            border-bottom-color: transparent;
        }

        .govuk-back-link::before {
            content: "";
            display: inline-block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 5px 6px 5px 0;
            border-color: transparent #0b0c0c transparent transparent;
            margin-right: 5px;
        }

        /* Buttons */
        .govuk-button {
            font-family: inherit;
            font-size: 19px;
            font-weight: 400;
            line-height: 1.1875;
            box-sizing: border-box;
            display: inline-block;
            width: 100%;
            margin: 0 0 22px 0;
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 0;
            background-color: #00703c;
            color: #fff;
            text-align: center;
            text-decoration: none;
            cursor: pointer;
            -webkit-appearance: none;
            box-shadow: 0 2px 0 #002d18;
        }

        .govuk-button:hover {
            background-color: #005a30;
        }

        .govuk-button:active {
            top: 2px;
            box-shadow: none;
        }

        .govuk-button:focus {
            outline: 3px solid #ffdd00;
            outline-offset: 0;
            box-shadow: inset 0 0 0 1px #ffdd00;
        }

        .govuk-button--secondary {
            background-color: #f3f2f1;
            color: #0b0c0c;
            box-shadow: 0 2px 0 #929191;
        }

        .govuk-button--secondary:hover {
            background-color: #dbdad9;
        }

        .govuk-button--warning {
            background-color: #d4351c;
            box-shadow: 0 2px 0 #55150b;
        }

        .govuk-button--warning:hover {
            background-color: #aa2a16;
        }

        .govuk-button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* Form elements */
        .govuk-form-group {
            margin-bottom: 30px;
        }

        .govuk-label {
            font-size: 19px;
            font-weight: 400;
            display: block;
            margin-bottom: 5px;
        }

        .govuk-label--l {
            font-size: 24px;
            font-weight: bold;
        }

        .govuk-input,
        .govuk-select {
            font-family: inherit;
            font-size: 19px;
            line-height: 1.25;
            width: 100%;
            padding: 5px;
            border: 2px solid #0b0c0c;
            border-radius: 0;
            -webkit-appearance: none;
            appearance: none;
        }

        .govuk-input:focus,
        .govuk-select:focus {
            outline: 3px solid #ffdd00;
            outline-offset: 0;
            box-shadow: inset 0 0 0 2px;
        }

        .govuk-input[type="date"],
        .govuk-input[type="time"] {
            max-width: 200px;
        }

        /* Checkboxes */
        .govuk-checkboxes__item {
            display: block;
            position: relative;
            min-height: 40px;
            margin-bottom: 10px;
            padding-left: 40px;
            clear: left;
        }

        .govuk-checkboxes__input {
            position: absolute;
            z-index: 1;
            top: -2px;
            left: 0;
            width: 44px;
            height: 44px;
            cursor: pointer;
            margin: 0;
            opacity: 0;
        }

        .govuk-checkboxes__label {
            display: inline-block;
            margin-bottom: 0;
            padding: 8px 15px 5px;
            cursor: pointer;
            touch-action: manipulation;
        }

        .govuk-checkboxes__label::before {
            content: "";
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 2px solid currentColor;
            background: transparent;
        }

        .govuk-checkboxes__label::after {
            content: "";
            box-sizing: border-box;
            position: absolute;
            top: 11px;
            left: 9px;
            width: 23px;
            height: 12px;
            transform: rotate(-45deg);
            border: solid;
            border-width: 0 0 5px 5px;
            border-top-color: transparent;
            opacity: 0;
            background: transparent;
        }

        .govuk-checkboxes__input:checked + .govuk-checkboxes__label::after {
            opacity: 1;
        }

        .govuk-checkboxes__input:focus + .govuk-checkboxes__label::before {
            border-width: 4px;
            outline: 3px solid transparent;
            outline-offset: 3px;
            box-shadow: 0 0 0 3px #ffdd00;
        }

        .govuk-checkboxes__input:disabled + .govuk-checkboxes__label {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .govuk-checkboxes__hint {
            display: block;
            padding-right: 15px;
            padding-left: 15px;
            color: #505a5f;
        }

        /* Inset text / Info boxes */
        .govuk-inset-text {
            padding: 15px;
            margin-bottom: 20px;
            margin-top: 20px;
            border-left: 10px solid #b1b4b6;
            font-size: 19px;
        }

        .govuk-inset-text--blue {
            border-left-color: #1d70b8;
        }

        /* Warning text */
        .govuk-warning-text {
            position: relative;
            padding: 10px 0;
            margin-bottom: 20px;
        }

        .govuk-warning-text__icon {
            position: absolute;
            left: 0;
            font-size: 32px;
            line-height: 1;
        }

        .govuk-warning-text__text {
            display: block;
            margin-left: 45px;
            font-weight: 700;
        }

        /* Summary list */
        .govuk-summary-list {
            margin-bottom: 20px;
        }

        .govuk-summary-list__row {
            border-bottom: 1px solid #b1b4b6;
            display: flex;
            flex-wrap: wrap;
            padding-top: 10px;
            padding-bottom: 10px;
        }

        .govuk-summary-list__row:first-child {
            border-top: 1px solid #b1b4b6;
        }

        .govuk-summary-list__key {
            font-weight: 700;
            margin-bottom: 5px;
            width: 30%;
        }

        .govuk-summary-list__value {
            width: 70%;
            word-wrap: break-word;
        }

        @media (max-width: 640px) {
            .govuk-summary-list__key,
            .govuk-summary-list__value {
                width: 100%;
            }
        }

        /* Panel */
        .govuk-panel {
            padding: 35px;
            margin-bottom: 30px;
            border: 5px solid transparent;
            text-align: center;
            background-color: #1d70b8;
            color: white;
        }

        .govuk-panel--confirmation {
            background-color: #00703c;
        }

        .govuk-panel__title {
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .govuk-panel__body {
            font-size: 36px;
        }

        @media (max-width: 640px) {
            .govuk-panel__title {
                font-size: 32px;
            }
            .govuk-panel__body {
                font-size: 24px;
            }
        }

        /* Lists */
        .govuk-list {
            margin-bottom: 20px;
            padding-left: 20px;
        }

        .govuk-list li {
            margin-bottom: 5px;
        }

        /* Details/Expansion */
        .govuk-details {
            margin-bottom: 20px;
        }

        .govuk-details__summary {
            display: inline-block;
            position: relative;
            padding-left: 25px;
            color: #1d70b8;
            cursor: pointer;
        }

        .govuk-details__summary:hover {
            color: #003078;
        }

        .govuk-details__summary::before {
            content: "";
            position: absolute;
            top: 5px;
            left: 0;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 7px 0 7px 12px;
            border-color: transparent transparent transparent currentColor;
        }

        .govuk-details[open] .govuk-details__summary::before {
            transform: rotate(90deg);
        }

        .govuk-details__text {
            padding: 15px;
            padding-left: 20px;
            border-left: 5px solid #b1b4b6;
            margin-top: 10px;
        }

        /* Image placeholder */
        .image-placeholder {
            width: 100%;
            max-width: 400px;
            height: 200px;
            background: #f3f2f1;
            border: 2px dashed #b1b4b6;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
            color: #505a5f;
            font-size: 16px;
        }

        /* Section break */
        .govuk-section-break {
            margin: 0;
            border: 0;
        }

        .govuk-section-break--l {
            margin-top: 30px;
            margin-bottom: 30px;
        }

        .govuk-section-break--visible {
            border-bottom: 1px solid #b1b4b6;
        }

        /* Custom additions */
        .call-script {
            background: #f3f2f1;
            padding: 20px;
            border-left: 10px solid #1d70b8;
            margin: 20px 0;
            font-family: monospace;
            white-space: pre-line;
        }

        .phone-number {
            font-size: 36px;
            font-weight: bold;
            color: #0b0c0c;
            margin: 15px 0;
        }

        .date-grid {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        @media (max-width: 640px) {
            .date-grid {
                grid-template-columns: 1fr;
            }
        }

        .hidden {
            display: none;
        }

        /* Milestone celebration */
        .milestone-banner {
            position: fixed;
            top: 80px;
            left: 50%;
            transform: translateX(-50%);
            background: #00703c;
            color: white;
            padding: 15px 30px;
            border-radius: 4px;
            font-weight: bold;
            font-size: 18px;
            z-index: 1000;
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
            animation: slideDown 0.3s ease-out;
        }

        @keyframes slideDown {
            from {
                top: -50px;
                opacity: 0;
            }
            to {
                top: 80px;
                opacity: 1;
            }
        }

        /* Utility classes */
        .govuk-!-margin-top-6 {
            margin-top: 30px;
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-container">
            <div class="logo">Maximus</div>
            <button class="save-btn" onclick="saveProgress()">💾 Save my progress</button>
        </div>
    </header>

    <div class="govuk-width-container">
        <main class="govuk-main-wrapper">
            <div class="progress-indicator">
                <div class="progress-bar-container">
                    <div class="progress-bar-fill" id="progressBarFill">
                        <span class="progress-bar-text" id="progressBarText">0%</span>
                    </div>
                    <span class="progress-bar-text dark" id="progressBarTextDark" style="display: none;">0%</span>
                </div>
                <ul class="progress-dots" id="progressDots">
                    <li class="progress-dot"></li>
                    <li class="progress-dot"></li>
                    <li class="progress-dot"></li>
                    <li class="progress-dot"></li>
                    <li class="progress-dot"></li>
                    <li class="progress-dot"></li>
                    <li class="progress-dot"></li>
                </ul>
            </div>

            <div id="screens"></div>
        </main>
    </div>

    <script>
        // State management
        const state = {
            currentScreen: 'intro',
            assessmentType: '',
            date: '',
            time: '',
            method: '',
            canAttend: '',
            hasAppointee: '',
            appointeeCanAttend: '',
            flags: {
                needsReschedule: false,
                bslInterpreter: false,
                languageInterpreter: '',
                audioRecording: false,
                homeVisit: false,
                accessibility: false,
                childrenSupervision: false,
                companion: false
            },
            documents: [],
            questionnaireStatus: '',
            alternativeDates: ['', '', ''],
            alternativeTimes: ['', '', ''],
            milestonesShown: {}
        };

        function renderScreen(screenNum) {
            state.currentScreen = screenNum;
            updateProgressDots();
            updateProgressBar();
            
            const screens = {
                'intro': renderIntro,
                1: renderQ1,
                2: renderQ2,
                3: renderQ3,
                '3a': renderQ3A,
                4: renderQ4,
                5: renderQ5,
                6: renderQ6,
                7: renderQ7,
                'callA': renderCallScreenA,
                'callB': renderCallScreenB,
                'callC': renderCallScreenC,
                'prepCall': renderPrepCallScreen
            };

            const container = document.getElementById('screens');
            container.innerHTML = '';
            screens[screenNum]();
            window.scrollTo(0, 0);
        }

        function updateProgressDots() {
            const dots = document.querySelectorAll('.progress-dot');
            const screenMap = {'intro': -1, 1: 0, 2: 1, 3: 2, '3a': 2, 4: 3, 5: 4, 6: 5, 7: 6};
            const currentIndex = screenMap[state.currentScreen] !== undefined ? screenMap[state.currentScreen] : -1;
            
            dots.forEach((dot, index) => {
                dot.classList.remove('active', 'completed');
                if (currentIndex >= 0) {
                    if (index < currentIndex) dot.classList.add('completed');
                    if (index === currentIndex) dot.classList.add('active');
                }
            });
        }

        function updateProgressBar() {
            const progressMap = {
                'intro': 10,
                1: 24,
                2: 38,
                3: 52,
                '3a': 52,
                4: 66,
                5: 80,
                6: 94,
                7: 100,
                'callA': 100,
                'callB': 100,
                'callC': 100,
                'prepCall': 100
            };

            const percentage = progressMap[state.currentScreen] || 10;
            const fill = document.getElementById('progressBarFill');
            const textWhite = document.getElementById('progressBarText');
            const textDark = document.getElementById('progressBarTextDark');

            fill.style.width = percentage + '%';
            
            // Show white text on fill, dark text outside fill
            if (percentage < 15) {
                textWhite.style.display = 'none';
                textDark.style.display = 'block';
                textDark.textContent = percentage + '%';
            } else {
                textWhite.style.display = 'block';
                textDark.style.display = 'none';
                textWhite.textContent = percentage + '%';
            }

            // Show milestone celebrations
            showMilestoneCelebration();
        }

        function showMilestoneCelebration() {
            const milestones = {
                4: "✓ Great progress! You're over halfway through",
                6: "✓ Almost there! One more question"
            };

            const message = milestones[state.currentScreen];

            if (message && !state.milestonesShown[state.currentScreen]) {
                state.milestonesShown[state.currentScreen] = true;
                
                const banner = document.createElement('div');
                banner.className = 'milestone-banner';
                banner.textContent = message;
                document.body.appendChild(banner);

                setTimeout(() => {
                    banner.style.animation = 'slideDown 0.3s ease-out reverse';
                    setTimeout(() => {
                        document.body.removeChild(banner);
                    }, 300);
                }, 2500);
            }
        }

        function renderIntro() {
            document.getElementById('screens').innerHTML = `
                <h1 class="govuk-heading-xl">Get ready for your assessment</h1>

                <p class="govuk-body" style="font-size: 24px;">Preparing for your assessment can feel complicated.</p>

                <p class="govuk-body" style="font-size: 20px; margin-top: 20px;"><strong>This tool makes it simpler. We'll:</strong></p>

                <ul class="govuk-list govuk-list--bullet" style="font-size: 19px; margin-bottom: 30px;">
                    <li>Work out what you need to do</li>
                    <li>Show you exactly what to say when you call</li>
                    <li>Help you arrange everything in one go</li>
                </ul>

                <div class="govuk-inset-text">
                    <p class="govuk-body"><strong>What this tool doesn't do:</strong></p>
                    <ul class="govuk-list govuk-list--bullet">
                        <li>Book or change your assessment (you'll need to call Maximus for that)</li>
                        <li>Submit any information to DWP</li>
                    </ul>
                </div>

                <div class="govuk-inset-text govuk-inset-text--blue" style="margin-top: 30px;">
                    <p class="govuk-body" style="margin-bottom: 0;">Thousands of people have used this tool to prepare for their assessment. Most people find arranging everything in one call takes less than 10 minutes.</p>
                </div>

                <p class="govuk-body"><strong>It only takes 5 minutes</strong> and you can save your progress anytime.</p>

                <button class="govuk-button" style="margin-top: 30px;" onclick="renderScreen(1)">Start</button>
            `;
        }

        function renderQ1() {
            document.getElementById('screens').innerHTML = `
                <span class="govuk-caption">Question 1 of 7</span>
                <h1 class="govuk-heading-xl">You are completing an assessment for:</h1>
                <button class="govuk-button" onclick="selectAssessmentType('PIP')">
                    PIP (Personal Independence Payment)
                </button>
                <button class="govuk-button" onclick="selectAssessmentType('WCA')">
                    WCA (Work Capability Assessment)
                </button>
            `;
        }

        function selectAssessmentType(type) {
            state.assessmentType = type;
            renderScreen(2);
        }

        function renderQ2() {
            document.getElementById('screens').innerHTML = `
                <a href="#" class="govuk-back-link" onclick="event.preventDefault(); renderScreen(1)">Back</a>
                <span class="govuk-caption">Question 2 of 7</span>
                <h1 class="govuk-heading-l">Check your appointment letter for the date, time and method of your assessment</h1>

                <div class="image-placeholder">
                    [Image: Letter with date/time/method highlighted]
                </div>

                <p class="govuk-body">Please enter your assessment information:</p>

                <div class="govuk-form-group">
                    <label class="govuk-label" for="date">Date</label>
                    <input class="govuk-input" type="date" id="date" value="${state.date}">
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label" for="time">Time</label>
                    <input class="govuk-input" type="time" id="time" value="${state.time}">
                </div>

                <div class="govuk-form-group">
                    <label class="govuk-label" for="method">Method</label>
                    <select class="govuk-select" id="method">
                        <option value="">Select...</option>
                        <option value="Telephone" ${state.method === 'Telephone' ? 'selected' : ''}>Telephone</option>
                        <option value="Video" ${state.method === 'Video' ? 'selected' : ''}>Video</option>
                        <option value="Face-to-face" ${state.method === 'Face-to-face' ? 'selected' : ''}>Face-to-face</option>
                    </select>
                </div>

                <h2 class="govuk-heading-m">Can you attend on this date and time?</h2>

                <button class="govuk-button" onclick="selectAttendance('yes')">
                    Yes, I can attend
                </button>
                <button class="govuk-button govuk-button--secondary" onclick="selectAttendance('no')">
                    No, I need to reschedule
                </button>
            `;
        }

        function selectAttendance(answer) {
            state.date = document.getElementById('date').value;
            state.time = document.getElementById('time').value;
            state.method = document.getElementById('method').value;
            
            if (!state.date || !state.time || !state.method) {
                alert('Please enter your assessment date, time, and method');
                return;
            }
            
            state.canAttend = answer;
            if (answer === 'no') {
                state.flags.needsReschedule = true;
            }
            renderScreen(3);
        }

        function renderQ3() {

                <p class="govuk-body">🕐 Monday-Friday, 9am-5pm</p>

                <div class="govuk-inset-text govuk-inset-text--blue" style="margin-top: 20px;">
                    <p class="govuk-body" style="margin-bottom: 0;">Most people find this call takes less than 10 minutes when they have their information ready.</p>
                </div>

                ${isOpen ? `
                    <div class="govuk-inset-text govuk-inset-text--blue">
                        ✓ Lines are open now - ready to call?
                    </div>
                    <a href="tel:08002888777" class="govuk-button">📞 Call now</a>
                ` : `
                    <div class="govuk-warning-text">
                        <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
                        <strong class="govuk-warning-text__text">
                            Lines reopen: [DAY] at [TIME] (in X hours)
                        </strong>
                    </div>

                    <h3 class="govuk-heading-m">We can text you a reminder</h3>
                    <div class="govuk-form-group">
                        <label class="govuk-label" for="phoneNum">Enter your mobile number</label>
                        <input class="govuk-input" type="tel" id="phoneNum" placeholder="+44" style="max-width: 300px;">
                        <button class="govuk-button" style="margin-top: 15px;" onclick="alert('SMS reminder would be set')">📱 Send me an SMS reminder</button>
                    </div>
                `}

                <div style="margin-top: 40px;">
                    <button class="govuk-button govuk-button--secondary" onclick="saveProgress()">
                        💾 Save my progress
                    </button>
                    <p class="govuk-body">When you save, we'll give you a code to continue your preparation after your call.</p>
                </div>
            `;
        }

        function generateCallScript() {
            const assessmentName = state.assessmentType === 'PIP' ? 'Personal Independence Payment' : 'Work Capability Assessment';
            let script = '';

            // Get alternative dates if they've been entered
            const dates = [];
            const altDate1 = document.getElementById('altDate1');
            const altDate2 = document.getElementById('altDate2');
            const altDate3 = document.getElementById('altDate3');
            const altTime1 = document.getElementById('altTime1');
            const altTime2 = document.getElementById('altTime2');
            const altTime3 = document.getElementById('altTime3');

            if (altDate1 && altDate1.value) {
                dates.push(`• ${formatDate(altDate1.value)}, ${altTime1.value.toLowerCase()}`);
            }
            if (altDate2 && altDate2.value) {
                dates.push(`• ${formatDate(altDate2.value)}, ${altTime2.value.toLowerCase()}`);
            }
            if (altDate3 && altDate3.value) {
                dates.push(`• ${formatDate(altDate3.value)}, ${altTime3.value.toLowerCase()}`);
            }

            const datesText = dates.length > 0 ? dates.join('\n') : '• [Your three alternative dates]';

            // Build support items list
            const supportItems = [];
            if (state.flags.languageInterpreter) supportItems.push(`• A ${state.flags.languageInterpreter} interpreter`);
            if (state.flags.bslInterpreter) supportItems.push('• A BSL interpreter');
            if (state.flags.audioRecording) supportItems.push('• Audio recording');
            if (state.flags.homeVisit) supportItems.push('• A home visit - I cannot travel to the Assessment Centre');
            if (state.flags.accessibility) supportItems.push('• Accessibility support - I have difficulty with stairs');
            if (state.flags.childrenSupervision) supportItems.push('• Supervision arrangements for children during my assessment');
            if (state.flags.companion) supportItems.push('• I\'m bringing a companion for support');

            // Scenario 1: Reschedule only
            if (state.flags.needsReschedule && !hasAnySupport()) {
                script = `Opening:
"I'm calling to reschedule my ${assessmentName} assessment. I have three alternative dates ready."

Your alternative dates:
${datesText}`;
            } 
            // Scenario 2: Reschedule + Support
            else if (state.flags.needsReschedule && hasAnySupport()) {
                script = `Opening:
"I'm calling about my ${assessmentName} assessment. I need to reschedule to a different date - I have three alternatives ready. I'll also need some support arranged for the new date."

Your alternative dates:
${datesText}

When asked about support:
"I need:
${supportItems.join('\n')}"`;
            } 
            // Scenario 3: Support only
            else {
                script = `Opening:
"I'm calling about my ${assessmentName} assessment on ${formatDate(state.date)}. I need to arrange some support."

When asked what support:
"I need:
${supportItems.join('\n')}"`;
            }

            return script;
        }

        function copyScript() {
            const script = generateCallScript();
            // Remove the header and separator for copying
            const cleanScript = script.replace('WHAT TO SAY WHEN YOU CALL\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n', '');
            navigator.clipboard.writeText(cleanScript).then(() => {
                alert('Script copied to clipboard!');
            });
        }

        function emailScript() {
            const script = generateCallScript();
            const subject = encodeURIComponent('My Assessment Call Script');
            const body = encodeURIComponent(script);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function checkIfLinesOpen() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            return day >= 1 && day <= 5 && hour >= 9 && hour < 17;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr + 'T00:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-GB', options);
        }

        function saveProgress() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            alert(`Your progress code is: ${code}\n\nWrite this down to resume your preparation later.\n\n(This is a demo - code won't actually save)`);
        }

        renderScreen('intro');
    </script>
</body>
</html>
