<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Before Your Assessment - Preparation Guide</title>
    <style>
        /* GOV.UK Design System Styling */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "GDS Transport", Arial, sans-serif;
            font-size: 19px;
            line-height: 1.5;
            color: #0b0c0c;
            background: #f3f2f1;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        .govuk-width-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 15px;
        }

        @media (min-width: 641px) {
            .govuk-width-container {
                padding: 0 30px;
            }
        }

        /* Improved Header with colored accent */
        .header {
            background: white;
            padding: 20px 0;
            border-bottom: 4px solid #00703c;
            margin-bottom: 30px;
        }

        .header-container {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        @media (min-width: 641px) {
            .header-container {
                padding: 0 30px;
            }
        }

        .logo {
            font-size: 30px;
            font-weight: bold;
            color: #003078;
        }

        .save-btn {
            background: #f3f2f1;
            border: 1px solid #b1b4b6;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            color: #0b0c0c;
            transition: all 0.2s ease;
        }

        .save-btn:hover {
            background: #e0e0e0;
            transform: translateY(-1px);
        }

        @media (max-width: 400px) {
            .logo {
                font-size: 24px;
            }
            
            .save-btn {
                font-size: 14px;
                padding: 8px 12px;
            }
        }

        /* Main Content */
        .govuk-main-wrapper {
            background: white;
            padding: 30px 15px 40px 15px;
            min-height: calc(100vh - 200px);
        }

        @media (min-width: 641px) {
            .govuk-main-wrapper {
                padding: 30px 30px 40px 30px;
            }
        }

        /* Improved Progress indicator - Slim bar design */
        .progress-indicator {
            margin-bottom: 30px;
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            margin-bottom: 5px;
            border: none;
            position: relative;
        }

        .progress-bar-fill {
            height: 100%;
            background: linear-gradient(90deg, #00703c 0%, #00a650 100%);
            border-radius: 4px;
            transition: width 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
        }

        .progress-bar-text {
            font-size: 14px;
            color: #505a5f;
            text-align: right;
            margin-top: 5px;
            display: block;
        }

        /* Typography */
        .govuk-heading-xl {
            font-size: 48px;
            line-height: 1.09375;
            font-weight: bold;
            margin-bottom: 30px;
            margin-top: 15px;
        }

        .govuk-heading-l {
            font-size: 36px;
            line-height: 1.11111;
            font-weight: bold;
            margin-bottom: 20px;
            margin-top: 15px;
        }

        .govuk-heading-m {
            font-size: 24px;
            line-height: 1.25;
            font-weight: bold;
            margin-bottom: 15px;
            margin-top: 15px;
        }

        .govuk-body {
            font-size: 19px;
            line-height: 1.5;
            margin-bottom: 20px;
        }

        .govuk-caption {
            font-size: 16px;
            font-weight: 700;
            color: #505a5f;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 5px;
        }

        .why-we-ask {
            font-size: 16px;
            color: #505a5f;
            font-style: italic;
            margin-top: 10px;
            display: block;
        }

        @media (max-width: 640px) {
            .govuk-heading-xl {
                font-size: 32px;
            }
            .govuk-heading-l {
                font-size: 24px;
            }
        }

        /* Back Link */
        .govuk-back-link {
            font-size: 16px;
            line-height: 1.25;
            display: inline-block;
            margin-bottom: 15px;
            margin-top: 15px;
            text-decoration: none;
            color: #0b0c0c;
            cursor: pointer;
        }

        .govuk-back-link:before {
            content: "";
            display: inline-block;
            width: 0;
            height: 0;
            border-style: solid;
            border-width: 5px 6px 5px 0;
            border-color: transparent #0b0c0c transparent transparent;
            margin-right: 8px;
        }

        .govuk-back-link:hover {
            color: #0b0c0c;
            text-decoration: underline;
        }

        /* Radio buttons */
        .govuk-radios__item {
            display: block;
            position: relative;
            min-height: 40px;
            margin-bottom: 20px;
            padding-left: 40px;
        }

        .govuk-radios__input {
            position: absolute;
            z-index: 1;
            top: -2px;
            left: 0;
            width: 40px;
            height: 40px;
            cursor: pointer;
            margin: 0;
            opacity: 0;
        }

        .govuk-radios__label {
            display: inline-block;
            margin-bottom: 0;
            padding: 8px 15px 5px;
            cursor: pointer;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            font-size: 19px;
            font-weight: normal;
        }

        .govuk-radios__label:before {
            content: "";
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 2px solid currentcolor;
            border-radius: 50%;
            background: white;
        }

        .govuk-radios__label:after {
            content: "";
            position: absolute;
            top: 10px;
            left: 10px;
            width: 0;
            height: 0;
            border: 10px solid currentcolor;
            border-radius: 50%;
            opacity: 0;
            background: currentcolor;
        }

        .govuk-radios__input:checked+.govuk-radios__label:after {
            opacity: 1;
        }

        .govuk-radios__input:focus+.govuk-radios__label:before {
            border-width: 4px;
            box-shadow: 0 0 0 3px #ffdd00;
        }

        .govuk-radios__hint {
            display: block;
            padding-right: 15px;
            color: #505a5f;
            font-size: 16px;
            margin-top: 5px;
        }

        /* Checkboxes */
        .govuk-checkboxes__item {
            display: block;
            position: relative;
            min-height: 40px;
            margin-bottom: 20px;
            padding-left: 40px;
        }

        .govuk-checkboxes__input {
            position: absolute;
            z-index: 1;
            top: -2px;
            left: 0;
            width: 40px;
            height: 40px;
            cursor: pointer;
            margin: 0;
            opacity: 0;
        }

        .govuk-checkboxes__label {
            display: inline-block;
            margin-bottom: 0;
            padding: 8px 15px 5px;
            cursor: pointer;
            -ms-touch-action: manipulation;
            touch-action: manipulation;
            font-size: 19px;
        }

        .govuk-checkboxes__label:before {
            content: "";
            box-sizing: border-box;
            position: absolute;
            top: 0;
            left: 0;
            width: 40px;
            height: 40px;
            border: 2px solid currentcolor;
            background: white;
        }

        .govuk-checkboxes__label:after {
            content: "";
            position: absolute;
            top: 11px;
            left: 9px;
            width: 23px;
            height: 12px;
            transform: rotate(-45deg);
            border: solid;
            border-width: 0 0 5px 5px;
            border-top-color: transparent;
            opacity: 0;
            background: transparent;
        }

        .govuk-checkboxes__input:checked+.govuk-checkboxes__label:after {
            opacity: 1;
        }

        .govuk-checkboxes__input:focus+.govuk-checkboxes__label:before {
            border-width: 4px;
            box-shadow: 0 0 0 3px #ffdd00;
        }

        .govuk-checkboxes__hint {
            display: block;
            padding-right: 15px;
            color: #505a5f;
            font-size: 16px;
            margin-top: 5px;
        }

        /* Buttons */
        .govuk-button {
            font-family: "GDS Transport", Arial, sans-serif;
            font-weight: 400;
            font-size: 19px;
            line-height: 1.1875;
            box-sizing: border-box;
            display: inline-block;
            position: relative;
            width: 100%;
            margin-top: 0;
            margin-bottom: 22px;
            padding: 12px 20px;
            border: 2px solid transparent;
            border-radius: 0;
            color: #fff;
            background-color: #00703c;
            box-shadow: 0 2px 0 #002d18;
            text-align: center;
            vertical-align: top;
            cursor: pointer;
            -webkit-appearance: none;
            text-decoration: none;
        }

        @media (min-width: 641px) {
            .govuk-button {
                width: auto;
            }
        }

        .govuk-button:hover {
            background-color: #005a30;
        }

        .govuk-button:active {
            top: 2px;
            box-shadow: none;
        }

        .govuk-button--secondary {
            background-color: #f3f2f1;
            box-shadow: 0 2px 0 #929191;
            color: #0b0c0c;
        }

        .govuk-button--secondary:hover {
            background-color: #dbdad9;
        }

        /* Form elements */
        .govuk-form-group {
            margin-bottom: 30px;
        }

        .govuk-label {
            display: block;
            font-weight: 400;
            font-size: 19px;
            margin-bottom: 5px;
        }

        .govuk-input {
            font-family: "GDS Transport", Arial, sans-serif;
            font-size: 19px;
            line-height: 1.25;
            box-sizing: border-box;
            width: 100%;
            height: 50px;
            padding: 5px;
            border: 2px solid #0b0c0c;
            border-radius: 0;
        }

        .govuk-input:focus {
            outline: 3px solid #ffdd00;
            outline-offset: 0;
            box-shadow: inset 0 0 0 2px;
        }

        .govuk-select {
            font-family: "GDS Transport", Arial, sans-serif;
            font-size: 19px;
            line-height: 1.25;
            box-sizing: border-box;
            width: 100%;
            height: 50px;
            padding: 5px;
            border: 2px solid #0b0c0c;
            border-radius: 0;
            background-color: white;
        }

        .govuk-select:focus {
            outline: 3px solid #ffdd00;
            outline-offset: 0;
            box-shadow: inset 0 0 0 2px;
        }

        /* Inset text */
        .govuk-inset-text {
            padding: 15px;
            margin-top: 20px;
            margin-bottom: 20px;
            clear: both;
            border-left: 10px solid #b1b4b6;
            background-color: #f3f2f1;
        }

        .govuk-inset-text--blue {
            border-left-color: #1d70b8;
            background-color: #e8f1f8;
        }

        .govuk-inset-text--green {
            border-left-color: #00703c;
            background-color: #e7f3ed;
        }

        .govuk-inset-text p {
            margin-bottom: 0;
        }

        .govuk-inset-text p:first-child {
            margin-top: 0;
        }

        /* Warning text */
        .govuk-warning-text {
            position: relative;
            padding: 10px 0;
            font-family: "GDS Transport", Arial, sans-serif;
            font-weight: 700;
            font-size: 19px;
            line-height: 1.25;
        }

        .govuk-warning-text__icon {
            font-family: Arial, sans-serif;
            font-weight: 700;
            display: inline-block;
            position: absolute;
            left: 0;
            min-width: 35px;
            min-height: 35px;
            margin-top: -7px;
            border: 3px solid #0b0c0c;
            border-radius: 50%;
            color: #fff;
            background: #0b0c0c;
            font-size: 30px;
            line-height: 29px;
            text-align: center;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }

        .govuk-warning-text__text {
            display: block;
            margin-left: 45px;
        }

        /* Section break */
        .govuk-section-break {
            margin: 0;
            border: 0;
        }

        .govuk-section-break--l {
            margin-top: 40px;
            margin-bottom: 40px;
        }

        .govuk-section-break--visible {
            border-bottom: 1px solid #b1b4b6;
        }

        /* Links */
        .govuk-link {
            color: #1d70b8;
            text-decoration: underline;
        }

        .govuk-link:hover {
            color: #003078;
        }

        /* Special styling for call script */
        .call-script {
            background: #f8f8f8;
            border: 3px solid #1d70b8;
            padding: 25px;
            margin: 25px 0;
            font-family: 'Courier New', monospace;
            font-size: 17px;
            line-height: 1.8;
            border-radius: 4px;
            white-space: pre-wrap;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        .phone-number {
            font-size: 32px;
            font-weight: bold;
            color: #00703c;
            margin: 15px 0;
        }

        .highlight-box {
            background: #ffe5cc;
            border-left: 5px solid #ff9933;
            padding: 15px;
            margin: 20px 0;
        }

        /* Conditional reveal */
        .conditional-reveal {
            border-left: 4px solid #b1b4b6;
            padding-left: 20px;
            margin-top: 15px;
            margin-bottom: 20px;
            display: none;
        }

        .conditional-reveal.visible {
            display: block;
        }

        @media print {
            .header, .progress-indicator, .govuk-button {
                display: none !important;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-container">
            <div class="logo">Assessment Prep</div>
            <button class="save-btn" onclick="saveProgress()">💾 Save</button>
        </div>
    </div>

    <div class="govuk-width-container">
        <main class="govuk-main-wrapper">
            <div id="app"></div>
        </main>
    </div>

    <script>
        let state = {
            assessmentType: '',
            date: '',
            clarityRating: null,
            flags: {
                needsReschedule: false,
                languageInterpreter: '',
                bslInterpreter: false,
                audioRecording: false,
                homeVisit: false,
                accessibility: false,
                childrenSupervision: false,
                companion: false,
                needsFormHelp: false
            },
            altDates: []
        };

        const screens = {
            'intro': 1,
            'clarity': 2,
            'assessment': 3,
            'date': 4,
            'flags': 5,
            'ready': 6
        };

        let currentScreen = 'intro';
        let history = [];

        function updateProgress() {
            const current = screens[currentScreen];
            const total = 6;
            const percentage = (current / total) * 100;
            
            const progressBar = document.querySelector('.progress-bar-fill');
            const progressText = document.querySelector('.progress-bar-text');
            
            if (progressBar && progressText) {
                progressBar.style.width = percentage + '%';
                progressText.textContent = `Step ${current} of ${total}`;
            }
        }

        function goBack() {
            if (history.length > 0) {
                currentScreen = history.pop();
                renderScreen(currentScreen);
            }
        }

        function navigateToScreen(screenName) {
            history.push(currentScreen);
            currentScreen = screenName;
            renderScreen(screenName);
        }

        function renderScreen(screenName) {
            const app = document.getElementById('app');
            
            switch(screenName) {
                case 'intro':
                    renderIntro();
                    break;
                case 'clarity':
                    renderClarity();
                    break;
                case 'assessment':
                    renderAssessment();
                    break;
                case 'date':
                    renderDate();
                    break;
                case 'flags':
                    renderFlags();
                    break;
                case 'ready':
                    renderReady();
                    break;
            }
            
            updateProgress();
            window.scrollTo(0, 0);
        }

        function renderIntro() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                    <span class="progress-bar-text">Step 1 of 6</span>
                </div>

                <h1 class="govuk-heading-xl">Before your assessment</h1>

                <p class="govuk-body govuk-body-l">Getting ready for your health assessment can feel overwhelming. We'll help you prepare what you need in just a few minutes.</p>

                <div class="govuk-inset-text govuk-inset-text--green">
                    <p>This tool will give you:</p>
                    <ul style="margin-top: 10px; margin-left: 20px;">
                        <li>✓ A simple script for what to say when you call</li>
                        <li>✓ A checklist of what to bring</li>
                        <li>✓ Clear next steps</li>
                    </ul>
                </div>

                <p class="govuk-body">It only takes about 3 minutes to complete.</p>

                <button class="govuk-button" onclick="navigateToScreen('clarity')">Start now</button>
            `;
            updateProgress();
        }

        function renderClarity() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <span class="progress-bar-text"></span>
                </div>

                ${history.length > 0 ? '<a class="govuk-back-link" onclick="goBack()">Back</a>' : ''}

                <span class="govuk-caption">Question 1</span>
                <h1 class="govuk-heading-l">On a scale from 1-5, how clear are you about what you need to do before your assessment?</h1>

                <div class="govuk-form-group">
                    <div class="govuk-radios">
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="clarity-1" name="clarity" type="radio" value="1" ${state.clarityRating === 1 ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="clarity-1">
                                <strong>1</strong> - Very Unclear
                            </label>
                        </div>
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="clarity-2" name="clarity" type="radio" value="2" ${state.clarityRating === 2 ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="clarity-2">
                                <strong>2</strong> - Unclear
                            </label>
                        </div>
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="clarity-3" name="clarity" type="radio" value="3" ${state.clarityRating === 3 ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="clarity-3">
                                <strong>3</strong> - Neither Clear nor Unclear
                            </label>
                        </div>
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="clarity-4" name="clarity" type="radio" value="4" ${state.clarityRating === 4 ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="clarity-4">
                                <strong>4</strong> - Clear
                            </label>
                        </div>
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="clarity-5" name="clarity" type="radio" value="5" ${state.clarityRating === 5 ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="clarity-5">
                                <strong>5</strong> - Very Clear
                            </label>
                        </div>
                    </div>
                </div>

                <button class="govuk-button" onclick="submitClarity()">Continue</button>
            `;
            updateProgress();
        }

        function submitClarity() {
            const selected = document.querySelector('input[name="clarity"]:checked');
            if (!selected) {
                alert('Please select an option before continuing');
                return;
            }
            state.clarityRating = parseInt(selected.value);
            navigateToScreen('assessment');
        }

        function renderAssessment() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <span class="progress-bar-text"></span>
                </div>

                ${history.length > 0 ? '<a class="govuk-back-link" onclick="goBack()">Back</a>' : ''}

                <span class="govuk-caption">Question 2</span>
                <h1 class="govuk-heading-l">What type of assessment are you preparing for?</h1>

                <div class="govuk-form-group">
                    <div class="govuk-radios">
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="pip" name="assessment" type="radio" value="PIP" ${state.assessmentType === 'PIP' ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="pip">
                                Personal Independence Payment (PIP)
                            </label>
                            <div class="govuk-radios__hint">
                                For help with daily living or mobility costs
                            </div>
                        </div>
                        <div class="govuk-radios__item">
                            <input class="govuk-radios__input" id="wca" name="assessment" type="radio" value="WCA" ${state.assessmentType === 'WCA' ? 'checked' : ''}>
                            <label class="govuk-radios__label" for="wca">
                                Work Capability Assessment (WCA)
                            </label>
                            <div class="govuk-radios__hint">
                                For Universal Credit or Employment and Support Allowance
                            </div>
                        </div>
                    </div>
                </div>

                <button class="govuk-button" onclick="submitAssessment()">Continue</button>
            `;
            updateProgress();
        }

        function submitAssessment() {
            const selected = document.querySelector('input[name="assessment"]:checked');
            if (!selected) {
                alert('Please select your assessment type');
                return;
            }
            state.assessmentType = selected.value;
            navigateToScreen('date');
        }

        function renderDate() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <span class="progress-bar-text"></span>
                </div>

                ${history.length > 0 ? '<a class="govuk-back-link" onclick="goBack()">Back</a>' : ''}

                <span class="govuk-caption">Question 3</span>
                <h1 class="govuk-heading-l">When is your assessment?</h1>

                <div class="govuk-form-group">
                    <label class="govuk-label" for="assessmentDate">Assessment date</label>
                    <input class="govuk-input" type="date" id="assessmentDate" value="${state.date}" style="max-width: 300px;">
                </div>

                <button class="govuk-button" onclick="submitDate()">Continue</button>
            `;
            updateProgress();
        }

        function submitDate() {
            const date = document.getElementById('assessmentDate').value;
            if (!date) {
                alert('Please enter your assessment date');
                return;
            }
            state.date = date;
            navigateToScreen('flags');
        }

        function renderFlags() {
            const app = document.getElementById('app');
            app.innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <span class="progress-bar-text"></span>
                </div>

                ${history.length > 0 ? '<a class="govuk-back-link" onclick="goBack()">Back</a>' : ''}

                <span class="govuk-caption">Question 4</span>
                <h1 class="govuk-heading-l">Do you need to arrange any of these?</h1>
                <p class="govuk-body">Select all that apply to your situation</p>

                <div class="govuk-checkboxes">
                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="reschedule" type="checkbox" ${state.flags.needsReschedule ? 'checked' : ''} onchange="toggleReschedule()">
                        <label class="govuk-checkboxes__label" for="reschedule">
                            Change my assessment date
                        </label>
                    </div>

                    <div id="rescheduleReveal" class="conditional-reveal ${state.flags.needsReschedule ? 'visible' : ''}">
                        <p class="govuk-body"><strong>Provide 3 alternative dates you're available:</strong></p>
                        <div class="govuk-form-group">
                            <label class="govuk-label" for="altDate1">First choice</label>
                            <div style="display: flex; gap: 10px; align-items: end;">
                                <input class="govuk-input" type="date" id="altDate1" style="max-width: 200px;">
                                <select class="govuk-select" id="altTime1" style="max-width: 150px;">
                                    <option>Morning</option>
                                    <option>Afternoon</option>
                                    <option>Any time</option>
                                </select>
                            </div>
                        </div>
                        <div class="govuk-form-group">
                            <label class="govuk-label" for="altDate2">Second choice</label>
                            <div style="display: flex; gap: 10px; align-items: end;">
                                <input class="govuk-input" type="date" id="altDate2" style="max-width: 200px;">
                                <select class="govuk-select" id="altTime2" style="max-width: 150px;">
                                    <option>Morning</option>
                                    <option>Afternoon</option>
                                    <option>Any time</option>
                                </select>
                            </div>
                        </div>
                        <div class="govuk-form-group">
                            <label class="govuk-label" for="altDate3">Third choice</label>
                            <div style="display: flex; gap: 10px; align-items: end;">
                                <input class="govuk-input" type="date" id="altDate3" style="max-width: 200px;">
                                <select class="govuk-select" id="altTime3" style="max-width: 150px;">
                                    <option>Morning</option>
                                    <option>Afternoon</option>
                                    <option>Any time</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="interpreter" type="checkbox" ${state.flags.languageInterpreter ? 'checked' : ''} onchange="toggleInterpreter()">
                        <label class="govuk-checkboxes__label" for="interpreter">
                            Language interpreter
                        </label>
                    </div>

                    <div id="interpreterReveal" class="conditional-reveal ${state.flags.languageInterpreter ? 'visible' : ''}">
                        <label class="govuk-label" for="language">Which language?</label>
                        <input class="govuk-input" type="text" id="language" value="${state.flags.languageInterpreter}" placeholder="e.g. Polish, Arabic, Urdu" style="max-width: 300px;">
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="bsl" type="checkbox" ${state.flags.bslInterpreter ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="bsl">
                            BSL interpreter
                        </label>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="audio" type="checkbox" ${state.flags.audioRecording ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="audio">
                            Audio recording of assessment
                        </label>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="home" type="checkbox" ${state.flags.homeVisit ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="home">
                            Home visit (I cannot travel)
                        </label>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="accessibility" type="checkbox" ${state.flags.accessibility ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="accessibility">
                            Accessibility support (e.g. ground floor room, no stairs)
                        </label>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="children" type="checkbox" ${state.flags.childrenSupervision ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="children">
                            Child supervision during assessment
                        </label>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="companion" type="checkbox" ${state.flags.companion ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="companion">
                            Bringing someone for support
                        </label>
                    </div>

                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="formHelp" type="checkbox" ${state.flags.needsFormHelp ? 'checked' : ''}>
                        <label class="govuk-checkboxes__label" for="formHelp">
                            Help completing my questionnaire
                        </label>
                    </div>
                </div>

                <button class="govuk-button" onclick="submitFlags()">Continue</button>
            `;
            updateProgress();
        }

        function toggleReschedule() {
            const checkbox = document.getElementById('reschedule');
            const reveal = document.getElementById('rescheduleReveal');
            if (checkbox.checked) {
                reveal.classList.add('visible');
            } else {
                reveal.classList.remove('visible');
            }
        }

        function toggleInterpreter() {
            const checkbox = document.getElementById('interpreter');
            const reveal = document.getElementById('interpreterReveal');
            if (checkbox.checked) {
                reveal.classList.add('visible');
            } else {
                reveal.classList.remove('visible');
            }
        }

        function submitFlags() {
            state.flags.needsReschedule = document.getElementById('reschedule').checked;
            state.flags.languageInterpreter = document.getElementById('interpreter').checked ? 
                (document.getElementById('language').value || 'interpreter') : '';
            state.flags.bslInterpreter = document.getElementById('bsl').checked;
            state.flags.audioRecording = document.getElementById('audio').checked;
            state.flags.homeVisit = document.getElementById('home').checked;
            state.flags.accessibility = document.getElementById('accessibility').checked;
            state.flags.childrenSupervision = document.getElementById('children').checked;
            state.flags.companion = document.getElementById('companion').checked;
            state.flags.needsFormHelp = document.getElementById('formHelp').checked;
            
            navigateToScreen('ready');
        }

        function hasAnySupport() {
            return state.flags.languageInterpreter || 
                   state.flags.bslInterpreter || 
                   state.flags.audioRecording || 
                   state.flags.homeVisit || 
                   state.flags.accessibility || 
                   state.flags.childrenSupervision || 
                   state.flags.companion;
        }

        function renderReady() {
            const app = document.getElementById('app');
            const script = generateCallScript();
            const isOpen = checkIfLinesOpen();

            app.innerHTML = `
                <div class="progress-indicator">
                    <div class="progress-bar-container">
                        <div class="progress-bar-fill"></div>
                    </div>
                    <span class="progress-bar-text"></span>
                </div>

                ${history.length > 0 ? '<a class="govuk-back-link" onclick="goBack()">Back</a>' : ''}

                <h1 class="govuk-heading-xl">You're ready to call</h1>

                <div class="govuk-inset-text govuk-inset-text--green">
                    <p style="font-size: 19px; margin: 0;">✓ Everything you need is on this page</p>
                </div>

                <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">

                <h2 class="govuk-heading-l">Step 1: Have this ready</h2>

                <div class="highlight-box">
                    <h3 class="govuk-heading-m" style="margin-top: 0;">📄 Your invitation letter</h3>
                    <p class="govuk-body">You'll need your Reference Number from the letter:</p>
                    
                    <svg width="100%" viewBox="0 0 400 400" style="max-width: 500px; margin: 20px 0;">
                        <!-- Letter background -->
                        <rect x="20" y="20" width="360" height="380" fill="white" stroke="#b1b4b6" stroke-width="2"/>
                        
                        <!-- Header -->
                        <text x="30" y="50" fill="#0b0c0c" font-size="12" font-weight="bold">MAXIMUS</text>
                        <text x="30" y="70" fill="#505a5f" font-size="9">Assessment Services</text>
                        
                        <!-- Your details -->
                        <text x="30" y="95" fill="#0b0c0c" font-size="10">Mr John Smith</text>
                        <text x="30" y="105" fill="#0b0c0c" font-size="10">123 High Street</text>
                        <text x="30" y="120" fill="#0b0c0c" font-size="10">London SW1A 1AA</text>
                        
                        <!-- Title -->
                        <text x="30" y="155" fill="#0b0c0c" font-size="14" font-weight="bold">Personal Independence Payment Assessment</text>
                        
                        <!-- Reference Number - Highlighted -->
                        <rect x="25" y="170" width="280" height="35" fill="#ffe5cc" stroke="#ff9933" stroke-width="2"/>
                        <text x="30" y="185" fill="#0b0c0c" font-size="11" font-weight="bold">Reference Number:</text>
                        <text x="30" y="200" fill="#0b0c0c" font-size="13" font-weight="bold" letter-spacing="1">PIP/23/456789/A</text>
                        
                        <!-- Body text -->
                        <text x="30" y="230" fill="#0b0c0c" font-size="10">Dear Mr Smith,</text>
                        <text x="30" y="250" fill="#0b0c0c" font-size="9">Your assessment appointment has been scheduled for:</text>
                        
                        <text x="30" y="275" fill="#0b0c0c" font-size="10" font-weight="bold">Date: Monday 15th January 2024</text>
                        <text x="30" y="290" fill="#0b0c0c" font-size="10" font-weight="bold">Time: 10:30 AM</text>
                        <text x="30" y="305" fill="#0b0c0c" font-size="10" font-weight="bold">Location: Maximus Assessment Centre</text>
                        
                        <text x="30" y="330" fill="#0b0c0c" font-size="9">Please bring this letter and your National Insurance number</text>
                        <text x="30" y="345" fill="#0b0c0c" font-size="9">to your appointment. If you need to reschedule or require</text>
                        <text x="30" y="360" fill="#0b0c0c" font-size="9">any support, please call us on 0800 288 8777.</text>
                        
                        <!-- Arrow pointing to reference -->
                        <path d="M 320 185 L 340 185 L 335 180 M 340 185 L 335 190" stroke="#ff9933" stroke-width="2" fill="none"/>
                        <text x="345" y="190" fill="#ff9933" font-size="11" font-weight="bold">← You'll need this</text>
                    </svg>
                </div>

                <div class="govuk-checkboxes">
                    <div class="govuk-checkboxes__item">
                        <input class="govuk-checkboxes__input" id="niCheck" type="checkbox">
                        <label class="govuk-checkboxes__label" for="niCheck">
                            Your National Insurance Number
                        </label>
                        <div class="govuk-checkboxes__hint">
                            <a href="#" class="govuk-link">Where to find your NI number</a>
                        </div>
                    </div>
                </div>

                <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">

                <h2 class="govuk-heading-l">Step 2: What you'll tell them</h2>

                <div class="call-script">${script}</div>

                <button class="govuk-button govuk-button--secondary" onclick="copyScript()">📋 Copy this to clipboard</button>
                <button class="govuk-button govuk-button--secondary" onclick="emailScript()">📧 Email this to me</button>

                <hr class="govuk-section-break govuk-section-break--l govuk-section-break--visible">

                <h2 class="govuk-heading-l">Step 3: When to call</h2>
                <p class="govuk-body"><strong>Maximus phone lines</strong></p>
                <div class="phone-number">📞 0800 288 8777</div>
                <p class="govuk-body">🕐 Monday-Friday, 9am-5pm</p>

                <div class="govuk-inset-text govuk-inset-text--blue" style="margin-top: 20px;">
                    <p class="govuk-body" style="margin-bottom: 0;">Most people find this call takes less than 10 minutes when they have their information ready.</p>
                </div>

                ${isOpen ? `
                    <div class="govuk-inset-text govuk-inset-text--blue">
                        ✓ Lines are open now - ready to call?
                    </div>
                    <a href="tel:08002888777" class="govuk-button">📞 Call now</a>
                ` : `
                    <div class="govuk-warning-text">
                        <span class="govuk-warning-text__icon" aria-hidden="true">!</span>
                        <strong class="govuk-warning-text__text">
                            Lines reopen: [DAY] at [TIME] (in X hours)
                        </strong>
                    </div>

                    <h3 class="govuk-heading-m">We can text you a reminder</h3>
                    <div class="govuk-form-group">
                        <label class="govuk-label" for="phoneNum">Enter your mobile number</label>
                        <input class="govuk-input" type="tel" id="phoneNum" placeholder="+44" style="max-width: 300px;">
                        <button class="govuk-button" style="margin-top: 15px;" onclick="alert('SMS reminder would be set')">📱 Send me an SMS reminder</button>
                    </div>
                `}

                <div style="margin-top: 40px;">
                    <button class="govuk-button govuk-button--secondary" onclick="saveProgress()">
                        💾 Save my progress
                    </button>
                    <p class="govuk-body">When you save, we'll give you a code to continue your preparation after your call.</p>
                </div>
            `;
            updateProgress();
        }

        function generateCallScript() {
            const assessmentName = state.assessmentType === 'PIP' ? 'Personal Independence Payment' : 'Work Capability Assessment';
            let script = '';

            // Get alternative dates if they've been entered
            const dates = [];
            const altDate1 = document.getElementById('altDate1');
            const altDate2 = document.getElementById('altDate2');
            const altDate3 = document.getElementById('altDate3');
            const altTime1 = document.getElementById('altTime1');
            const altTime2 = document.getElementById('altTime2');
            const altTime3 = document.getElementById('altTime3');

            if (altDate1 && altDate1.value) {
                dates.push(`• ${formatDate(altDate1.value)}, ${altTime1.value.toLowerCase()}`);
            }
            if (altDate2 && altDate2.value) {
                dates.push(`• ${formatDate(altDate2.value)}, ${altTime2.value.toLowerCase()}`);
            }
            if (altDate3 && altDate3.value) {
                dates.push(`• ${formatDate(altDate3.value)}, ${altTime3.value.toLowerCase()}`);
            }

            const datesText = dates.length > 0 ? dates.join('\n') : '• [Your three alternative dates]';

            // Build support items list
            const supportItems = [];
            if (state.flags.languageInterpreter) supportItems.push(`• A ${state.flags.languageInterpreter} interpreter`);
            if (state.flags.bslInterpreter) supportItems.push('• A BSL interpreter');
            if (state.flags.audioRecording) supportItems.push('• Audio recording');
            if (state.flags.homeVisit) supportItems.push('• I cannot travel to the Assessment Centre');
            if (state.flags.accessibility) supportItems.push('• Accessibility support - I have difficulty with stairs');
            if (state.flags.childrenSupervision) supportItems.push('• Supervision arrangements for children during my assessment');
            if (state.flags.companion) supportItems.push('• I\'m bringing a companion for support');
            if (state.flags.needsFormHelp) supportItems.push('• Help with my questionnaire');

            // Scenario 1: Reschedule only (no support)
            if (state.flags.needsReschedule && !hasAnySupport() && !state.flags.needsFormHelp) {
                script = `Opening:
"I'm calling to reschedule my ${assessmentName} assessment. I have three alternative dates ready."

Your alternative dates:
${datesText}`;
            } 
            // Scenario 2: Reschedule + Support/Form Help
            else if (state.flags.needsReschedule && (hasAnySupport() || state.flags.needsFormHelp)) {
                script = `Opening:
"I'm calling about my ${assessmentName} assessment. I need to reschedule to a different date - I have three alternatives ready. I'll also need some ${state.flags.needsFormHelp ? 'help and ' : ''}support arranged for the new date."

Your alternative dates:
${datesText}

When asked about ${state.flags.needsFormHelp ? 'help and ' : ''}support:
"I need:
${supportItems.join('\n')}"`;
            } 
            // Scenario 3: Support/Form Help only (no reschedule)
            else {
                script = `Opening:
"I'm calling about my ${assessmentName} assessment on ${formatDate(state.date)}. I need to arrange some ${state.flags.needsFormHelp ? 'help and ' : ''}support."

When asked what ${state.flags.needsFormHelp ? 'help and ' : ''}support:
"I need:
${supportItems.join('\n')}"`;
            }

            return script;
        }

        function copyScript() {
            const script = generateCallScript();
            // Remove the header and separator for copying
            const cleanScript = script.replace('WHAT TO SAY WHEN YOU CALL\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n', '');
            navigator.clipboard.writeText(cleanScript).then(() => {
                alert('Script copied to clipboard!');
            });
        }

        function emailScript() {
            const script = generateCallScript();
            const subject = encodeURIComponent('My Assessment Call Script');
            const body = encodeURIComponent(script);
            window.location.href = `mailto:?subject=${subject}&body=${body}`;
        }

        function checkIfLinesOpen() {
            const now = new Date();
            const day = now.getDay();
            const hour = now.getHours();
            return day >= 1 && day <= 5 && hour >= 9 && hour < 17;
        }

        function formatDate(dateStr) {
            if (!dateStr) return '';
            const date = new Date(dateStr + 'T00:00:00');
            const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
            return date.toLocaleDateString('en-GB', options);
        }

        function saveProgress() {
            const code = Math.random().toString(36).substring(2, 8).toUpperCase();
            alert(`Your progress code is: ${code}\n\nWrite this down to resume your preparation later.\n\n(This is a demo - code won't actually save)`);
        }

        renderScreen('intro');
    </script>
</body>
</html>
